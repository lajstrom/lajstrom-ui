# nginx for the Lajstrom UI. Everything it writes goes to /tmp (pid, temp files and the files
# docker/40-lajstrom-ui.sh generates), so the root filesystem can be read-only.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  log_format json escape=json '{"time":"$time_iso8601","method":"$request_method","path":"$uri",'
                              '"status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
                              '"request_id":"$http_x_request_id","remote":"$remote_addr"}';
  access_log /dev/stdout json;

  sendfile on;
  server_tokens off;
  # Relative Location headers: nginx listens on 8080 inside the container, which is never the
  # port the browser used (Ingress, Service, docker -p).
  absolute_redirect off;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  server {
    # IPv4 only: listening on [::] fails to start in clusters with IPv6 disabled.
    listen 8080;

    root /usr/share/nginx/html;

    # Liveness and readiness of the UI container itself (not routed by the Ingress).
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Standalone use (docker run, compose): the root goes to the UI. Behind an Ingress, / belongs
    # to the Lajstrom server and never reaches this container.
    location = / {
      return 302 /ui/;
    }

    location = /ui {
      return 301 /ui/;
    }

    # Runtime configuration, written at container start.
    location = /ui/config.json {
      alias /tmp/lajstrom-ui/config.json;
      default_type application/json;
      include /tmp/lajstrom-ui/headers;
      add_header Cache-Control "no-store" always;
    }

    # Hashed build output: cache forever.
    location /ui/assets/ {
      include /tmp/lajstrom-ui/headers;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # The service worker of the mock must not be cached, so a new build replaces it.
    location = /ui/mockServiceWorker.js {
      include /tmp/lajstrom-ui/headers;
      add_header Cache-Control "no-cache" always;
    }

    # The single-page app: unknown paths below /ui/ get index.html and the router decides.
    location /ui/ {
      include /tmp/lajstrom-ui/headers;
      add_header Cache-Control "no-cache" always;
      try_files $uri /ui/index.html;
    }

    # /api and /-/ forwarded to Lajstrom when LAJSTROM_API_UPSTREAM is set; empty otherwise.
    include /tmp/lajstrom-ui/api-proxy.conf;
  }
}
