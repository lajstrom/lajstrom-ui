# What the UI reads and the server does not answer yet (docs/api-proposal.md), as additions to
# openapi/server.yaml. npm run gen:api merges the two into public/openapi.yaml, the spec of the
# demo's API page (scripts/openapi-merge.ts). This file may only add: an operation, a schema, a
# property or a parameter; each is marked proposed in the merged spec. One that the server has
# already fails the merge: the server has it now, so it goes from here. A description is
# appended to the server's.
info:
  description: >-
    This is the spec of the UI's demo: the server's, merged with what the UI reads and the server
    does not answer yet, each marked proposed (x-lajstrom-status: proposed). "Try it out" is
    answered in the browser by the demo's mock, on generated data, as the signed-in demo user;
    nothing reaches a server.


components:
  schemas:
    User:
      properties:
        groups:
          type: array
          description: >-
            An OIDC user's groups that count now, from its latest login (docs/spec/rbac.md §8), as
            whoami answers the caller's; absent for a local user. The admin sees through which
            groups a user reaches a repo (lajstrom/lajstrom#69).
          items: {type: string}
    CIPolicyList:
      properties:
        issuers:
          type: array
          description: >-
            The issuers of the server's auth.ci.issuers, in its order: the names a policy's issuer
            may take, and the platform of each, whose claims a policy may name (docs/spec/rbac.md
            §11). The UI offers them in the form of a policy, and the claims of the platform
            (lajstrom/lajstrom#937).
          items: {$ref: "#/components/schemas/CIIssuer"}
    CIIssuer:
      type: object
      description: An issuer of auth.ci.issuers, as a policy names it.
      required: [name, platform]
      properties:
        name: {type: string, description: "The issuer's name: a policy's issuer, and the <issuer> of the principal ci:<issuer>/<project>."}
        platform: {type: string, enum: [github, gitlab], description: The CI platform of its tokens.}
