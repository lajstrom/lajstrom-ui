# Release (#14). A pushed tag v* builds the bundle once, lajstrom-ui-<version>.tar.gz with its
# SBOM and checksums.txt (scripts/build-release.sh), and tries that tar.gz at the root of a
# static origin and below /ui/ of the image made of it. The job publish then pushes that image,
# linux/amd64 and linux/arm64 with an SBOM and provenance, as ghcr.io/lajstrom/lajstrom-ui:<tag>
# (and :latest for a stable version), signs it and checksums.txt with cosign, keyless through the
# job's GitHub OIDC token, and creates a draft GitHub release with the tar.gz, its SBOM,
# checksums.txt, its signature, the server API the bundle was built for and the changes since the
# previous release. A maintainer publishes the draft. README.md, Release, has the steps.
#
# On a pull request, a push to main or by hand it is a dry run: the same bundle, tried the same
# way, and the image built for both platforms; nothing is pushed, signed or released. The bundle
# is kept as the run's artifact release for 14 days.
#
# One image, configured at start. Images per environment (#16) are not decided; they would be
# more builds from the same unpacked tar.gz in the job publish, never another bundle.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A release is never cancelled half-way; a newer push replaces a dry run.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  IMAGE: ghcr.io/lajstrom/lajstrom-ui
  # The cosign of lajstrom/lajstrom's release workflow.
  COSIGN_VERSION: v3.1.4

jobs:
  bundle:
    name: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # tags: git describe names the bundle of a dry run
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The Node of the check job and of the Dockerfile's build stage.
          node-version: 24
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: The version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = tag ]; then
            version="$REF_NAME"
            if ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::the tag $version is not vX.Y.Z or vX.Y.Z-<pre-release>"
              exit 1
            fi
            # The SBOM names the package at this version; package.json stays 0.0.0 in git.
            npm version "${version#v}" --no-git-tag-version --allow-same-version
          else
            version="$(git describe --tags --always)"
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "Version: \`$version\`" >>"$GITHUB_STEP_SUMMARY"
      - name: Typecheck, lint, test, build
        # CI's check job runs it on every pull request and push to main; a release on its tag too.
        if: github.ref_type == 'tag'
        run: npm run check
      - name: The bundle
        env:
          LAJSTROM_UI_VERSION: ${{ steps.version.outputs.version }}
        run: sh scripts/build-release.sh
      - name: The tar.gz at the root of a static origin
        # nginx stands in for object storage behind a CDN: the files as they are, and index.html for
        # a path without a file. config.json next to the bundle makes it the demo: no server.
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/origin"
          mkdir -p "$root"
          tar -xzf dist/release/lajstrom-ui-*.tar.gz -C "$root" --strip-components=1
          printf '{"apiBaseUrl":"","mock":true,"demo":true,"title":"Lajstrom"}\n' >"$root/config.json"
          cat >"$RUNNER_TEMP/origin.conf" <<'EOF'
          server {
            listen 8080;
            root /usr/share/nginx/html;
            location / {
              try_files $uri /index.html;
            }
          }
          EOF
          docker run -d --name origin -p 8081:8080 \
            -v "$root:/usr/share/nginx/html:ro" -v "$RUNNER_TEMP/origin.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginxinc/nginx-unprivileged:stable-alpine
      # The docker-container driver builds both platforms; the image only copies files onto
      # nginx, so arm64 needs no emulation.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: The image of the tar.gz, below /ui/
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/bundle"
          mkdir -p "$bundle"
          tar -xzf dist/release/lajstrom-ui-*.tar.gz -C "$bundle" --strip-components=1
          docker buildx build --platform linux/amd64,linux/arm64 --build-context "bundle=$bundle" .
          docker buildx build --build-context "bundle=$bundle" --load -t lajstrom-ui:release .
          docker run -d --name ui --read-only --tmpfs /tmp --cap-drop ALL -p 8080:8080 \
            -e LAJSTROM_UI_MOCK=true lajstrom-ui:release
          for _ in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8080/healthz && break; sleep 1; done
          curl -sf http://localhost:8080/ui/build.json | jq -c .
      - name: Playwright's Chromium
        run: npx playwright install --with-deps chromium
      - name: Try both
        run: node scripts/try-bundle.ts http://localhost:8081/ http://localhost:8080/ui/
      - name: Logs
        if: failure()
        run: |
          docker logs origin 2>&1 | tail -n 50 || true
          docker logs ui 2>&1 | tail -n 50 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish
    needs: bundle
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # the draft release and its assets
      packages: write # ghcr.io/lajstrom/lajstrom-ui
      id-token: write # cosign keyless: the OIDC token Fulcio certifies
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the previous tag, for the notes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist/release
      - name: The bundle the job bundle tried
        id: bundle
        run: |
          set -euo pipefail
          (cd dist/release && sha256sum -c checksums.txt)
          bundle="$RUNNER_TEMP/bundle"
          mkdir -p "$bundle"
          tar -xzf dist/release/lajstrom-ui-*.tar.gz -C "$bundle" --strip-components=1
          [ "$(jq -r .version "$bundle/build.json")" = "$GITHUB_REF_NAME" ] || { echo "::error::build.json is not $GITHUB_REF_NAME"; exit 1; }
          {
            echo "dir=$bundle"
            echo "commit=$(jq -r .contract.serverCommit "$bundle/build.json")"
            echo "server=$(jq -r .contract.serverVersion "$bundle/build.json")"
            echo "api=$(jq -r .contract.api "$bundle/build.json")"
            echo "date=$(jq -r .date "$bundle/build.json")"
          } >>"$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the image
        id: image
        env:
          BUNDLE: ${{ steps.bundle.outputs.dir }}
          SERVER_COMMIT: ${{ steps.bundle.outputs.commit }}
          SERVER_VERSION: ${{ steps.bundle.outputs.server }}
          API: ${{ steps.bundle.outputs.api }}
          CREATED: ${{ steps.bundle.outputs.date }}
        run: |
          set -euo pipefail
          tags=(-t "${IMAGE}:${GITHUB_REF_NAME}")
          # A pre-release (v0.1.0-rc.1) is pulled only by its tag.
          case "${GITHUB_REF_NAME}" in *-*) ;; *) tags+=(-t "${IMAGE}:latest") ;; esac
          docker buildx build --platform linux/amd64,linux/arm64 --build-context "bundle=${BUNDLE}" \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.created=${CREATED}" \
            --label "io.lajstrom.ui.server-api=/api/${API} of lajstrom/lajstrom@${SERVER_COMMIT}${SERVER_VERSION:+ (${SERVER_VERSION})}" \
            --sbom=true --provenance=true --metadata-file "${RUNNER_TEMP}/image.json" --push "${tags[@]}" .
          digest="$(jq -r '."containerimage.digest"' "${RUNNER_TEMP}/image.json")"
          echo "digest=${digest}" >>"$GITHUB_OUTPUT"
          echo "Pushed \`${IMAGE}:${GITHUB_REF_NAME}\`, ${digest}" >>"$GITHUB_STEP_SUMMARY"
      - name: Sign the image and checksums.txt
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          id="${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}"
          issuer=https://token.actions.githubusercontent.com
          cosign sign --yes "${IMAGE}@${DIGEST}"
          # What the bundle contains, which the image's own SBOM (its Alpine and nginx) does not see.
          cosign attest --yes --type spdxjson --predicate dist/release/lajstrom-ui-*.tar.gz.sbom.json "${IMAGE}@${DIGEST}"
          cosign sign-blob --yes --bundle dist/release/checksums.txt.sigstore.json dist/release/checksums.txt
          cosign verify "${IMAGE}@${DIGEST}" --certificate-identity "$id" --certificate-oidc-issuer "$issuer" >/dev/null
          cosign verify-blob dist/release/checksums.txt --bundle dist/release/checksums.txt.sigstore.json \
            --certificate-identity "$id" --certificate-oidc-issuer "$issuer"
      - name: The draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.image.outputs.digest }}
          SERVER_COMMIT: ${{ steps.bundle.outputs.commit }}
          SERVER_VERSION: ${{ steps.bundle.outputs.server }}
          API: ${{ steps.bundle.outputs.api }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          args=(--draft --verify-tag --title "$tag" --generate-notes --notes-file "${RUNNER_TEMP}/notes.md")
          case "$tag" in
            *-*) args+=(--prerelease) ;;
            *)
              # A stable version lists the changes since the previous stable one, not since its rc.
              previous="$(git describe --tags --abbrev=0 --match 'v*' --exclude '*-*' "${tag}^" 2>/dev/null || true)"
              if [ -n "$previous" ]; then args+=(--notes-start-tag "$previous"); fi
              ;;
          esac
          name="lajstrom-ui-${tag#v}"
          server="lajstrom/lajstrom@${SERVER_COMMIT:0:7}"
          cat >"${RUNNER_TEMP}/notes.md" <<EOF
          Built for \`/api/${API}\` of the server at [${server}](https://github.com/lajstrom/lajstrom/commit/${SERVER_COMMIT})${SERVER_VERSION:+ (${SERVER_VERSION})}: README.md, Compatibility.

          - \`${name}.tar.gz\`: the bundle, for any static origin (README.md, Deploy).
          - \`${IMAGE}:${tag}\` (\`${DIGEST}\`), linux/amd64 and linux/arm64: the bundle behind nginx below \`/ui/\`.
          - \`checksums.txt\` and its signature \`checksums.txt.sigstore.json\`; the image is signed the same way:

            \`\`\`sh
            cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \\
              --certificate-identity ${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF} \\
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            \`\`\`
          EOF
          gh release create "$tag" "${args[@]}" dist/release/*
          echo "Draft release $tag: $(gh release view "$tag" --json url --jq .url)" >>"$GITHUB_STEP_SUMMARY"
