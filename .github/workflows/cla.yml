# CLA bot: collects Contributor License Agreement signatures as pull request comments and stores
# them in this repository, without an external service.
#
# Signatures are written to signatures/version1/cla.json on the `cla-signatures` branch. That
# branch must exist and must not be protected, because the bot commits to it with GITHUB_TOKEN;
# `main` is protected and cannot take direct commits.
#
# pull_request_target runs this workflow from the base branch with a write token. It must never
# check out or run code from the pull request.
#
# Note: contributor-assistant/github-action is archived upstream (read-only, no further releases).
# It still works; if it breaks, switch to a maintained fork.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize]

permissions: {}

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: CLA Assistant
        if: >-
          (github.event_name == 'pull_request_target') ||
          (github.event.issue.pull_request &&
            (github.event.comment.body == 'recheck' ||
             github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/lajstrom/lajstrom/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: dependabot[bot],renovate[bot]
          create-file-commit-message: "chore(cla): create CLA signature file"
          signed-commit-message: "chore(cla): $contributorName signed the CLA in $owner/$repo"
