name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Dependency licenses allowed without a maintainer decision (see CONTRIBUTING.md), in the
  # semicolon-separated form license-checker expects.
  ALLOWED_LICENSES: Apache-2.0;MIT;BSD-2-Clause;BSD-3-Clause;ISC;MPL-2.0;Unlicense;CC0-1.0;0BSD

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    # Node from the same image line as the Dockerfile's build stage.
    container: node:24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck, lint, test, build
        run: npm run check

  licenses:
    name: licenses
    runs-on: ubuntu-latest
    container: node:24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Licenses of everything shipped to the browser
        # `dependencies` are what the bundle contains (the mock included); dev tooling is not
        # distributed.
        run: >-
          npx --yes license-checker-rseidelsohn@5.0.1 --production --excludePrivatePackages
          --onlyAllow "${ALLOWED_LICENSES}" --summary

  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t lajstrom-ui:ci .
      - name: Smoke test, read-only and non-root as on Kubernetes
        run: |
          set -euo pipefail
          docker run -d --name ui --read-only --tmpfs /tmp --cap-drop ALL \
            -p 8080:8080 -e LAJSTROM_UI_MOCK=true lajstrom-ui:ci
          for _ in $(seq 1 30); do curl -sf http://localhost:8080/healthz && break; sleep 1; done
          curl -sf http://localhost:8080/ui/ | grep -q 'id="root"'
          curl -sf http://localhost:8080/ui/apt/ubuntu-internal | grep -q 'id="root"'
          curl -sf http://localhost:8080/ui/config.json | grep -q '"mock":true'
          curl -sfI http://localhost:8080/ui/ | grep -qi '^content-security-policy:'
          test "$(curl -s -o /dev/null -w '%{redirect_url}' http://localhost:8080/)" != ""
      - name: Container logs
        if: always()
        run: docker logs ui 2>&1 | tail -50 || true

  snippet-scan:
    name: snippet-scan
    runs-on: ubuntu-latest
    env:
      SCANOSS_VERSION: 1.54.3
      # Optional: a SCANOSS API key (repository secret) switches the scan from the shared,
      # rate-limited OSSKB endpoint to the keyed API. Forks never see the secret and fall back.
      SCANOSS_API_KEY: ${{ secrets.SCANOSS_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install ScanOSS client
        run: python -m pip install --disable-pip-version-check "scanoss==${SCANOSS_VERSION}"
      - name: Select files to scan
        # Pull requests: only files added or changed in the PR. Pushes to main: the whole tree.
        # Only source code is scanned: the snippet scan exists to catch copied code, and the
        # free OSSKB endpoint is rate-limited, so docs, YAML, JSON, images and lock files are
        # not sent at all. The selection is copied into a scratch directory so the scanner
        # sees nothing else.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          target="${RUNNER_TEMP}/scan-input"
          mkdir -p "${target}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git diff --name-only --diff-filter=ACMR "${BASE_SHA}...HEAD" > "${RUNNER_TEMP}/changed.txt"
          else
            git ls-files > "${RUNNER_TEMP}/changed.txt"
          fi
          count=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            case "$f" in
              # Generated by `msw init` (MIT): third-party by design, not copied code.
              public/mockServiceWorker.js) continue ;;
              *.ts|*.tsx|*.js|*.mjs|*.css|*.html|*.sh|*.conf|Dockerfile|*/Dockerfile) ;;
              *) continue ;;
            esac
            mkdir -p "${target}/$(dirname "$f")"
            cp "$f" "${target}/$f"
            count=$((count + 1))
          done < "${RUNNER_TEMP}/changed.txt"
          echo "files selected: ${count}"
          echo "SCAN_FILE_COUNT=${count}" >> "${GITHUB_ENV}"
      - name: Scan against the SCANOSS knowledge base
        # Only file fingerprints are sent, never source code. The free OSSKB endpoint is shared
        # by every GitHub runner and gets rate-limited; when the service is unavailable the
        # scan is reported as skipped instead of failing the build. A real match still fails.
        run: |
          # The default shell runs with -e; the scanner pipeline below is allowed to fail so
          # that the API-availability check after it can decide. Keep -u and pipefail.
          set +e -uo pipefail
          if [ "${SCAN_FILE_COUNT:-0}" = "0" ]; then
            echo "SCAN_STATE=skipped-no-files" >> "${GITHUB_ENV}"
            echo "::notice::snippet-scan: no files to scan"
            exit 0
          fi
          args=(--retry 1 --output "${RUNNER_TEMP}/scanoss-results.json")
          if [ -n "${SCANOSS_API_KEY}" ]; then
            args+=(--apiurl https://api.scanoss.com/scan/direct --key "${SCANOSS_API_KEY}")
          fi
          scanoss-py scan "${args[@]}" "${RUNNER_TEMP}/scan-input" 2>&1 | tee "${RUNNER_TEMP}/scanoss.log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -eq 0 ]; then
            [ -s "${RUNNER_TEMP}/scanoss-results.json" ] || echo '{}' > "${RUNNER_TEMP}/scanoss-results.json"
            echo "SCAN_STATE=scanned" >> "${GITHUB_ENV}"
            exit 0
          fi
          if grep -qiE "rate limit|503|unavailable|ConnectionError|timed out" "${RUNNER_TEMP}/scanoss.log"; then
            echo "SCAN_STATE=skipped-api-unavailable" >> "${GITHUB_ENV}"
            echo "::warning::snippet-scan: SCANOSS API unavailable (rate limit or outage); scan skipped for this run"
            exit 0
          fi
          echo "::error::snippet-scan: scanner failed for a reason other than API availability"
          exit "$rc"
      - name: Fail on undeclared third-party matches
        if: env.SCAN_STATE == 'scanned'
        # Exit code 2 means at least one file or snippet matched third-party code that is not
        # declared in scanoss.json. Explain the match in the pull request; see CONTRIBUTING.md.
        run: |
          scanoss-py inspect undeclared \
            --input "${RUNNER_TEMP}/scanoss-results.json" \
            --format md \
            --output "${RUNNER_TEMP}/scanoss-undeclared.md" \
            --status "${RUNNER_TEMP}/scanoss-status.md"
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Snippet scan (ScanOSS ${SCANOSS_VERSION})"
            echo
            echo "State: \`${SCAN_STATE:-unknown}\`, files selected: ${SCAN_FILE_COUNT:-0}"
            echo
            cat "${RUNNER_TEMP}/scanoss-status.md" 2>/dev/null || true
            cat "${RUNNER_TEMP}/scanoss-undeclared.md" 2>/dev/null || true
          } >> "${GITHUB_STEP_SUMMARY}"

  dco:
    name: dco
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check Signed-off-by on every commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # One line per commit: sha, parent count, signed-off (true/false), subject.
          gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/commits" \
            --jq '.[] | [.sha[0:12], (.parents | length), (.commit.message | split("\n") | any(test("^Signed-off-by: .+ <.+>\\s*$"))), (.commit.message | split("\n")[0])] | @tsv' \
            > commits.tsv
          missing=0
          while IFS=$'\t' read -r sha parents signed subject; do
            if [ "${parents}" -gt 1 ]; then
              echo "skip  ${sha} (merge commit) ${subject}"
            elif [ "${signed}" = "true" ]; then
              echo "ok    ${sha} ${subject}"
            else
              echo "::error::Commit ${sha} has no Signed-off-by line: ${subject}"
              missing=$((missing + 1))
            fi
          done < commits.tsv
          if [ "${missing}" -gt 0 ]; then
            echo "${missing} commit(s) are not signed off. Use 'git commit -s'; to fix existing commits run 'git rebase --signoff main' and push again. See CONTRIBUTING.md."
            exit 1
          fi
